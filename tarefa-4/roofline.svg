<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Roofline empírico dos programas da Tarefa 4</title>
  <desc id="desc">O programa memory-bound aparece com intensidade 0,0417 FLOP por byte e 2,10 GFLOP por segundo. O compute-bound aparece com intensidade 200 FLOP por byte e 76 GFLOP por segundo.</desc>
  <rect width="900" height="520" fill="#fbfbf9"/>
  <text x="450" y="29" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#222">Roofline empírico — Intel Core i7-13650HX</text>

  <g stroke="#deded8" stroke-width="1">
    <line x1="85" y1="430" x2="850" y2="430"/>
    <line x1="85" y1="305" x2="850" y2="305"/>
    <line x1="85" y1="180" x2="850" y2="180"/>
    <line x1="85" y1="55" x2="850" y2="55"/>
    <line x1="85" y1="55" x2="85" y2="430"/>
    <line x1="238" y1="55" x2="238" y2="430"/>
    <line x1="391" y1="55" x2="391" y2="430"/>
    <line x1="544" y1="55" x2="544" y2="430"/>
    <line x1="697" y1="55" x2="697" y2="430"/>
    <line x1="850" y1="55" x2="850" y2="430"/>
  </g>

  <g stroke="#555" stroke-width="1.5">
    <line x1="85" y1="430" x2="850" y2="430"/>
    <line x1="85" y1="55" x2="85" y2="430"/>
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#555">
    <text x="85" y="449" text-anchor="middle">0,01</text>
    <text x="238" y="449" text-anchor="middle">0,1</text>
    <text x="391" y="449" text-anchor="middle">1</text>
    <text x="544" y="449" text-anchor="middle">10</text>
    <text x="697" y="449" text-anchor="middle">100</text>
    <text x="850" y="449" text-anchor="middle">1000</text>
    <text x="73" y="434" text-anchor="end">0,1</text>
    <text x="73" y="309" text-anchor="end">1</text>
    <text x="73" y="184" text-anchor="end">10</text>
    <text x="73" y="59" text-anchor="end">100</text>
    <text x="468" y="479" text-anchor="middle" font-size="14">Intensidade aritmética (FLOP/byte útil) — escala log</text>
    <text x="22" y="243" text-anchor="middle" font-size="14" transform="rotate(-90 22 243)">Desempenho (GFLOP/s) — escala log</text>
  </g>

  <line x1="418" y1="70" x2="418" y2="430" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="426" y="418" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">ponto de equilíbrio: 1,51 FLOP/byte</text>

  <polyline points="85,342 418,70" fill="none" stroke="#2b6f9f" stroke-width="4" stroke-linecap="round"/>
  <line x1="418" y1="70" x2="850" y2="70" stroke="#9b2f2f" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="305" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2b6f9f" transform="rotate(-39 150 305)">teto de memória: 50,36 GB/s</text>
  <text x="575" y="59" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#9b2f2f">teto computacional sustentado: 76,00 GFLOP/s</text>

  <circle cx="180" cy="265" r="7" fill="#167a55" stroke="#fff" stroke-width="2"/>
  <rect x="104" y="226" width="151" height="30" rx="4" fill="#e5f3ed" stroke="#167a55"/>
  <text x="180" y="239" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#145d43">MEMORY-BOUND</text>
  <text x="180" y="251" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#145d43">0,0417 FLOP/B · 2,10 GFLOP/s</text>

  <circle cx="743" cy="70" r="7" fill="#7c3fa0" stroke="#fff" stroke-width="2"/>
  <line x1="751" y1="74" x2="775" y2="100" stroke="#7c3fa0" stroke-width="1.5"/>
  <rect x="680" y="100" width="167" height="30" rx="4" fill="#f0e8f5" stroke="#7c3fa0"/>
  <text x="764" y="113" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#63317f">COMPUTE-BOUND</text>
  <text x="764" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#63317f">200 FLOP/B · 76,00 GFLOP/s</text>

  <text x="450" y="506" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">Tetos e pontos obtidos pelas melhores medições dos dois kernels; tráfego útil mínimo.</text>
</svg>
